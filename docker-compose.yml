services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: decisionhub
      POSTGRES_USER: decisionhub
      POSTGRES_PASSWORD: decisionhub
    ports:
      - "5432:5432"
    volumes:
      - decisionhub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decisionhub -d decisionhub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  decisionhub-postgres:
