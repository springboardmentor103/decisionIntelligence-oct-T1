spring.application.name=decisionhub-api
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/decisionhub}
spring.datasource.username=${DATABASE_USERNAME:decisionhub}
spring.datasource.password=${DATABASE_PASSWORD:decisionhub}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}
app.mail.from=${MAIL_FROM:}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

management.endpoints.web.exposure.include=health,info
