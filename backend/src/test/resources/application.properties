spring.application.name=backend

# Test DataSource Configuration - uses DB_USERNAME and DB_PASSWORD if present in the environment,
# falling back to safe local developer defaults for standalone test executions.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/decisionhub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

jwt.secret=DecisionHubTestSecretKeyForJWTSigning2026Secure